<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chat</title>
  <style>
    body { font-family: sans-serif; margin: 0; }
    #auth { max-width: 500px; margin: 3rem auto; padding: 0 1rem; }
    #chat { display: none; height: 100vh; }
    #sidebar { width: 260px; flex-shrink: 0; border-right: 1px solid #ddd; padding: 1rem; box-sizing: border-box; display: flex; flex-direction: column; gap: 0.5rem; }
    #conv-list { flex: 1; overflow-y: auto; }
    .conv { padding: 0.5rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv:hover { background: #f0f0f0; }
    .conv.active { background: #dde7ff; }
    #main { flex: 1; display: flex; flex-direction: column; padding: 1rem; box-sizing: border-box; min-width: 0; }
    #log { flex: 1; border: 1px solid #ccc; border-radius: 8px; padding: 1rem; overflow-y: auto; margin-bottom: 1rem; }
    .msg { white-space: pre-wrap; margin: 0.5rem 0; }
    .user { color: #1a4fd6; }
    .status { color: #888; font-style: italic; }
    input { padding: 0.5rem; }
    #message { width: 75%; }
    #error { color: #c00; }
  </style>
</head>
<body>
  <!-- Login / signup -->
  <div id="auth">
    <h1>Chat</h1>
    <form id="auth-form">
      <input id="username" placeholder="username" required>
      <input id="password" type="password" placeholder="password" required>
      <button type="submit">Log in</button>
      <button type="button" id="signup-btn">Sign up</button>
    </form>
    <p id="error"></p>
  </div>

  <!-- Chat -->
  <div id="chat">
    <div id="sidebar">
      <button id="new-chat-btn">+ New chat</button>
      <div id="conv-list"></div>
      <button id="logout-btn">Log out</button>
    </div>
    <div id="main">
      <div id="log"></div>
      <form id="chat-form">
        <input id="message" placeholder="Type a message" autocomplete="off" required>
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script>
    let token = null;
    let conversationId = crypto.randomUUID();

    const authBox = document.getElementById("auth");
    const chatBox = document.getElementById("chat");
    const errorEl = document.getElementById("error");
    const log = document.getElementById("log");
    const list = document.getElementById("conv-list");

    function showChat() {
      authBox.style.display = "none";
      chatBox.style.display = "flex";
      errorEl.textContent = "";
    }

    function showLogin(message) {
      token = null;
      conversationId = crypto.randomUUID();
      log.innerHTML = "";
      list.innerHTML = "";
      chatBox.style.display = "none";
      authBox.style.display = "block";
      errorEl.textContent = message || "";
    }

    // fetch with the token attached; returns null if the session expired
    async function api(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: { ...(options.headers || {}), "Authorization": "Bearer " + token },
      });
      if (res.status === 401) {
        showLogin("Session expired, please log in again");
        return null;
      }
      return res;
    }

    function addMessage(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    async function loadConversations() {
      const res = await api("/conversations");
      if (!res || !res.ok) return;
      const items = await res.json();
      list.innerHTML = "";
      for (const c of items) {
        const el = document.createElement("div");
        el.className = "conv" + (c.id === conversationId ? " active" : "");
        el.textContent = c.title || "Untitled chat";
        el.addEventListener("click", () => openConversation(c.id));
        list.appendChild(el);
      }
    }

    async function openConversation(id) {
      const res = await api(`/conversations/${id}/messages`);
      if (!res || !res.ok) return;
      const messages = await res.json();
      conversationId = id;
      log.innerHTML = "";
      for (const m of messages) {
        if (m.role === "user") addMessage("user", "You: " + m.content);
        else addMessage("bot", m.content);
      }
      loadConversations();
    }

    function newChat() {
      conversationId = crypto.randomUUID();
      log.innerHTML = "";
      loadConversations();
    }

    // ----- auth -----
    async function authRequest(path) {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      return fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
    }

    async function login() {
      const res = await authRequest("/login");
      if (!res.ok) {
        errorEl.textContent = "Wrong username or password";
        return;
      }
      const data = await res.json();
      token = data.access_token;
      showChat();
      newChat();
    }

    document.getElementById("auth-form").addEventListener("submit", (e) => {
      e.preventDefault();
      login();
    });

    document.getElementById("signup-btn").addEventListener("click", async () => {
      const res = await authRequest("/signup");
      if (!res.ok) {
        errorEl.textContent = "Could not sign up (username may be taken)";
        return;
      }
      await login();
    });

    document.getElementById("logout-btn").addEventListener("click", () => showLogin(""));
    document.getElementById("new-chat-btn").addEventListener("click", newChat);

    // ----- sending a message -----
    document.getElementById("chat-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("message");
      const text = input.value;
      input.value = "";

      addMessage("user", "You: " + text);
      const botEl = addMessage("bot", "");

      const res = await api("/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversation_id: conversationId, message: text }),
      });
      if (!res) return;
      if (!res.ok) {
        botEl.textContent = "Error " + res.status;
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const events = buffer.split("\n\n");
        buffer = events.pop();

        for (const event of events) {
          if (!event.startsWith("data: ")) continue;
          const payload = event.slice(6);
          if (payload === "[DONE]") {
            loadConversations();   // refresh the sidebar (new chats appear here)
            return;
          }

          const data = JSON.parse(payload);
          if (data.tool) {
            // a tool is running: show a status line
            botEl.textContent = "Using " + data.tool + "...";
            botEl.classList.add("status");
          } else if (data.text) {
            // real answer text: clear the status line first
            if (botEl.classList.contains("status")) {
              botEl.textContent = "";
              botEl.classList.remove("status");
            }
            botEl.textContent += data.text;
          }
          log.scrollTop = log.scrollHeight;
        }
      }
    });
  </script>
</body>
</html>
